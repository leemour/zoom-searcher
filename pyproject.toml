[project]
name = "zoom-searcher"
version = "0.1.0"
description = "Скачивает транскрипты встреч Zoom и ищет по ним с учётом морфологии русского языка"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viacheslav Ptsarev" }]
keywords = ["zoom", "transcripts", "search", "stemming", "cli"]
dependencies = [
    "snowballstemmer>=2.2.0",
    "playwright>=1.62.0",
]

[project.scripts]
ztx = "zoom_searcher.cli:main"

[project.urls]
Homepage = "https://github.com/leemour/zoom-searcher"
Issues = "https://github.com/leemour/zoom-searcher/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoom_searcher"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Проект русскоязычный: кириллица в строках и комментариях — норма, а не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=zoom_searcher",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/zoom_searcher"]
omit = ["*/zoom.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
